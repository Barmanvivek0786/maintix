name: Build Release AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-aab:
    name: Build Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Validate Supabase credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -sS -o /tmp/supabase-auth-response.txt \
            -w "%{http_code}" \
            "${SUPABASE_URL}/auth/v1/settings" \
            -H "apikey: ${SUPABASE_ANON_KEY}")

          echo "Supabase Auth HTTP status: ${status}"

          if [ "$status" != "200" ]; then
            echo "The Supabase URL/key pair was rejected."
            cat /tmp/supabase-auth-response.txt
            exit 1
          fi

      - name: Create Flutter defines
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          
          required = [
              "SUPABASE_URL",
              "SUPABASE_ANON_KEY",
              "RAZORPAY_KEY_ID",
          ]
          
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing GitHub secrets: " + ", ".join(missing))
              
          with open("dart_defines.json", "w", encoding="utf-8") as file:
              json.dump(
                  {name: os.environ[name] for name in required},
                  file
              )
          PY

      - name: Build release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter clean
          flutter pub get
          flutter build appbundle \
            --release \
            --dart-define-from-file=dart_defines.json

      - name: Remove generated secrets
        if: always()
        run: rm -f dart_defines.json

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
